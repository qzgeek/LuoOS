# =============================================================================
#   LuoOS 插件配置文件
#   项目地址: https://github.com/qzgeek/LuoOS
#   作者: chara201x, qzgeek (黔中极客), CatXiaolan
# =============================================================================
#
#  修改提示
#  1. 本文件为 YAML 格式，缩进必须用空格（不要用 Tab），同级的键要对齐。
#  2. 修改后需重启服务器，或在游戏内执行 /los reload 重载（部分项仍需重启）。
#  3. 如无特殊需求，保持默认值即可；带「合法值」的项请勿填写范围外的数字。
#
#  关于新旧键名
#  本插件同时兼容新版分组键（setting / account / qq_bot / status-card ...）
#  与旧版扁平键（如 bot.enabled、official_qq.enabled）。
#  推荐使用下方的新版分组写法；若你的文件里两者同时存在，
#  以分组键为准，旧键仅作为找不到分组键时的兜底。
# =============================================================================


# =============================================================================
# 一、插件基础设置
# =============================================================================

setting:
  # 语言文件。插件发出的所有提示、报错和界面文字都会按此语言显示。
  # 目前支持: zh_cn（简体中文）
  # 影响范围: 游戏内提示、QQ机器人回复、控制台插件日志。
  language: zh_cn

  # 插件版本标记（禁止修改）。
  # 该值由插件在升级时用于判断配置结构是否需要迁移，
  # 手工改动可能导致升级逻辑误判，请保持默认。
  version: 1.0

  # 调试模式。
  # 开启后会输出大量细节日志，包括 QQ 消息收发内容与命令解析过程。
  # 用于排查问题；正常运行建议关闭，否则日志会被快速刷满。
  # 合法值: true（输出详细日志） / false（仅输出关键日志）
  debug: false


# =============================================================================
# 二、登录认证功能
# =============================================================================

account:
  # 登录认证功能总开关。
  # 此处控制整个认证模块是否加载；下方 enableAuthentication 控制是否强制玩家登录。
  # 一般保持开启；只有确认服务器不打算使用插件认证时才改为 false。
  enable: true

  # 是否启用登录/注册认证。
  # 开启后，玩家进入服务器必须先用 /login 或 /register 完成认证才能行动。
  # 关闭后所有玩家无需密码即可进入游戏。
  # 警告：关闭后离线玩家账号可被同名冒充，强烈建议保持开启。
  # 合法值: true（开启） / false（关闭）
  enableAuthentication: true

  # 是否允许离线玩家使用扩展字符命名（中文、特殊符号等）。
  # 开启后，基岩版玩家与中文名玩家可正常进入。
  # 关闭后仅允许 [a-zA-Z0-9_+-.] 字符的用户名，中文名玩家将被拒绝登录。
  # 说明：本项只影响「名字能否通过校验」，不代表放行正版验证。
  # 合法值: true（允许扩展字符） / false（仅 ASCII 字符）
  allowMoreOfflineUsernameCharacters: true

  # 是否允许离线（非正版）玩家进入在线模式服务器。
  # 开启后，非标准纯英文名的玩家将绕过 Mojang 正版验证（常见于基岩版服务器）。
  # 关闭后仅正版账号可进入。
  # 安全提示：开启会降低账号安全等级，请配合白名单与登录密码一起使用。
  # 合法值: true（允许离线玩家） / false（仅正版玩家）
  allowOfflinePlayers: true

  # 是否区分同名正版与离线玩家的登录数据。
  # 开启后，同名正版和离线玩家拥有各自独立的账号数据（按 UUID 区分），
  # 例如「正版 Steve」与「离线 Steve」的密码、背包互不影响。
  # 关闭后两者共用同一份数据，可能互相覆盖。
  # 合法值: true（分离存储，推荐） / false（合并存储）
  separateOnlineOfflineAccounts: true

  # 是否拦截不带命名空间前缀的 login/register 等命令。
  # 开启后，玩家直接输入 /login 会被拦截，必须使用 /los login。
  # 用于避免与其他认证类插件（如 AuthMe、TAB 等）的命令冲突。
  # 若服务器只有本插件处理认证，保持关闭即可，玩家体验更自然。
  # 合法值: true（拦截裸命令） / false（不拦截）
  enableUnprefixedCommandHijack: false

  # 玩家进入服务器后，必须在多少秒内完成登录或注册。
  # 超时未完成者会被自动踢出，防止未认证账号占用在线名额。
  # 合法值: 1 - 3600（秒）
  loginTimeout: 120

  # 未登录玩家每隔多少秒收到一次登录/注册提醒。
  # 数值过小会频繁弹提示影响玩家，过大则玩家容易忘记登录。
  # 合法值: 1 - 600（秒）
  loginReminderSeconds: 10

  # 注册密码允许的最短长度。
  # 建议不低于 6，过短容易被暴力破解。
  # 合法值: 1 - 64
  minPasswordLength: 4

  # 注册密码允许的最长长度。
  # 必须大于等于最短长度；过快增长会略微增加哈希计算开销。
  # 合法值: 4 - 256
  maxPasswordLength: 32

  # 无需登录的玩家名称列表（前缀匹配）。
  # 名单中的玩家进入服务器时跳过登录/注册流程，直接可玩。
  # 常用于假人、机器人账号。
  # 匹配规则：前缀匹配，填写 "BOT_" 会匹配所有以 BOT_ 开头的名字。
  # 格式：每行一个名称或前缀，前面加两个空格和短横线。
  # 安全提示：仅填写确实不需要密码的账号，例如假人；不要填写真人玩家名。
  loginBypassNames:
    - "BOT_"
    - "假人_"
    - '[Bot]'

  # 无需登录的 IP 地址列表（前缀匹配）。
  # 来自名单内 IP 的连接跳过登录/注册，常用于本机测试或同机部署的代理。
  # 匹配规则：前缀匹配，填写 "192.168.1." 会匹配整个网段。
  # 格式：每行一个 IP 或前缀，前面加两个空格和短横线。
  loginBypassIps:
    - "127.0.0.1"

  # 玩家 ID 允许的字符集（正则表达式字符组）。
  # 用于校验白名单申请时填写的游戏 ID 是否合法。
  # 默认允许：大小写字母、数字、下划线、短横线、点。
  allowed_id_chars: a-zA-Z0-9_-.

  # 玩家 ID 允许的最大长度。
  # 超过该长度的 ID 将被拒绝申请白名单。
  # 合法值: 3 - 32
  max_id_length: 16

  # 是否启用 LuoOS 自带的白名单检查。
  # 说明：白名单判定为「双重条件」——
  #   1) 本项为 true，且玩家在 JSON 白名单文件中；或
  #   2) 数据库白名单表 qq_whitelist 中存在任意记录（此时自动进入白名单模式）。
  # 因此只要 QQ 机器人有玩家申请过白名单，未申请者就会被拒绝进入。
  # 合法值: true（启用） / false（禁用）
  enableWhitelist: false


# =============================================================================
# 三、玩家账号绑定
# =============================================================================

account-binder:
  # 是否启用账号绑定功能（/los bind）。
  # 开启后，玩家可将多个小号绑定到一个主账号，共享主账号的游戏数据
  # （背包、位置、进度等）。同一绑定组内同一时间只允许一个账号在线。
  # 适合「正版 + 离线」或「多端登录同一存档」的场景。
  # 合法值: true（启用） / false（禁用）
  enable: true

  # 绑定数据的存储方式。
  # sqlite：本地单文件数据库，无需额外配置，适合单机或小型服务器。
  # mysql：使用下方 MySQL 连接信息，适合多服共用或已有数据库的服务器。
  # 合法值: sqlite / mysql
  bindingStorage: sqlite

  # MySQL 连接配置（仅当 bindingStorage 设为 mysql 时生效）。
  # url 格式: jdbc:mysql://主机地址:端口/数据库名
  #   建议附加参数: ?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  # user: 数据库用户名
  # password: 数据库密码
  # 安全提示：请使用独立数据库账号并授予最小权限，不要直接使用 root。
  mysql:
    url: ""
    user: ""
    password: ""


# =============================================================================
# 四、QQ 机器人功能
# =============================================================================

qq_bot:
  # QQ 机器人功能总开关。
  # 必须为 true，下方的私人机器人与官方机器人才能启动；
  # 设为 false 会同时关闭两个通道。
  enable: false

  # ---------------------------------------------------------------------------
  # 4.1 私人 QQ 机器人（OneBot 协议）
  #     使用自己的 QQ 号搭建的机器人，需要配合机器人框架（如 NapCat）。
  # ---------------------------------------------------------------------------
  private-bot:
    # 是否启用私人机器人通道。
    # 与官方机器人互相独立，两者可同时开启，共用同一套命令与白名单数据。
    enable: false

    # 插件内置 OneBot WebSocket 服务器，机器人框架需用「正向 WS」连接到本插件。
    # 支持的框架：NapCat（推荐），其他兼容 OneBot v11 的框架亦可。
    # host: 监听地址。0.0.0.0 表示监听所有网卡；仅本机连接可填 127.0.0.1 更安全。
    # port: 监听端口，需与机器人框架中配置的反向 WS 地址一致。
    host: 0.0.0.0
    port: 35013

    # 鉴权令牌。必须与机器人框架配置中的 access_token 完全一致，否则拒绝连接。
    # 留空则不校验令牌（不推荐，等于任何程序都能连上你的机器人）。
    # 安全提示：公网可访问时务必设置，且不要使用弱口令。
    access_token: ""

    # 允许响应命令的 QQ 群号列表。
    # 格式：[群号1, 群号2, ...]，例如 [1078700819, 1091673243]
    # 设为空数组 [] 表示允许所有群（调试用，不推荐生产环境）。
    # 说明：这里填的是 QQ 群号（数字），与官方机器人的 group_openid 不同。
    qq_groups: []

    # 每个 QQ 号最多可申请的白名单数量。
    # 防止单个账号占用过多游戏 ID。
    # 合法值: 1 - 99
    max_per_qq: 3

    # 在 QQ 群中发送何种内容可获取状态卡片。
    # 玩家在群内发送列表中的任意一词，机器人即回复状态卡片图片。
    # 格式：每行一个触发词，前面加两个空格和短横线；不区分大小写。
    card-cmd:
      - "服务器还活着吗"
      - "状态"
      - "服务器状态"
      - "status"
      - "state"

    # 速率限制时间窗口（秒）。
    # 与下方 rate-limit-max 配合使用，共同限制单个群的消息频率。
    rate-limit-window: 60

    # 速率限制次数，即在上面窗口时间内最多响应多少条消息。
    # 例如 window=60、max=10 表示每群每分钟最多处理 10 条命令，超出将被忽略。
    # 说明：管理员不受此限制。
    rate-limit-max: 10

    # 随机回复最小延迟（毫秒）。
    # 机器人收到命令后，会在此范围内随机等待一段时间再回复，用于模拟真人打字。
    # 说明：仅对私人机器人生效；官方机器人不做人为延迟。
    reply-delay-min-ms: 500

    # 随机回复最大延迟（毫秒）。必须大于等于最小延迟。
    # 设为 0 与 0 表示不延迟、立即回复。
    reply-delay-max-ms: 2000

    # 是否输出该通道的调试日志。
    # 开启后会打印 WebSocket 收发内容与命令处理细节，用于排查连接或命令问题。
    # 合法值: true（输出） / false（不输出）
    debug_log: false

  # ---------------------------------------------------------------------------
  # 4.2 官方 QQ 机器人（QQ 开放平台）
  #     在 QQ 开放平台注册的官方机器人，比私人机器人更稳定、不易被封。
  # ---------------------------------------------------------------------------
  official-bot:
    # 是否启用官方机器人通道。与私人机器人互相独立，可同时开启。
    enable: false

    # 以下两项需前往 QQ 开放平台（https://q.qq.com）创建机器人后获取。
    # app_id: 机器人的 AppID（一串数字）。
    # app_secret: 机器人的 AppSecret（密钥）。
    # 安全提示：app_secret 等同于机器人密码，切勿外泄或提交到版本库。
    app_id: ""
    app_secret: ""

    # 在官方 QQ 群中发送何种内容可获取状态卡片。
    # 与私人机器人的 card-cmd 相互独立，可按需分别设置。
    # 格式：每行一个触发词，前面加两个空格和短横线。
    card-cmd:
      - "服务器还活着吗"
      - "状态"
      - "服务器状态"
      - "status"
      - "state"

    # 验证码位数。用于绑定 QQ 号时发送到邮箱的验证码长度。
    # 位数越大越难猜测，推荐保持 6 位或更高。
    # 合法值: 6 - 9
    code_digits: 6

    # 验证码有效时间（分钟）。超过该时间未使用即失效，需重新申请。
    # 说明：验证通过前不会建立正式身份映射，也不占用该 QQ 号。
    # 合法值: 1 - 60
    code_expire_minutes: 10

    # 官方 API 根地址。通常无需修改，仅私有化部署或测试时才需调整。
    api_base: "https://api.bot.qq.com"

    # 访问凭证（AccessToken）服务地址。通常无需修改。
    token_base: "https://api.bot.qq.com"

    # 网关地址。留空时由插件自动向平台查询（推荐保持留空）；
    # 仅在平台调整或特殊网络环境下才需手动填写 wss:// 地址。
    gateway: ""

    # 是否对官方通道开启人为延迟。默认关闭。
    # 官方机器人本身受平台被动回复窗口约束，额外延迟只会让玩家觉得慢。
    reply-delay: false

    # 官方 QQ 需要向绑定者邮箱发送验证码，因此必须配置可用的发件邮箱。
    # 说明：官方 QQ 的绑定流程为「群里 @机器人 发送 绑定QQ <QQ号>」，
    #       验证码会发送到 <QQ号>@qq.com，因此该邮箱必须能正常发信。
    smtp:
      # SMTP 服务器地址。
      # 常用值：QQ 邮箱 smtp.qq.com，网易 126 邮箱 smtp.126.com，
      #         163 邮箱 smtp.163.com。
      # 注意：必须与下方发件账号的邮箱服务商一致，
      #       用 126 账号去连 smtp.qq.com 会返回「535 Login fail」。
      host: smtp.qq.com

      # SMTP 端口。
      # 465 表示 SSL 加密（推荐）；587 表示 STARTTLS。
      # 插件会根据端口自动选择加密方式，无需额外设置。
      port: 465

      # 发件邮箱账号，填写完整邮箱地址，例如 someone@126.com。
      username: ""

      # 发件邮箱的授权码。
      # 注意：这里填的是邮箱服务商生成的「授权码」，不是邮箱登录密码。
      # 获取方式：登录邮箱网页版 → 设置 → 账户 → 开启 SMTP 服务后生成。
      # 安全提示：授权码等同密码，切勿外泄或提交到版本库。
      password: ""

      # 发件人地址，通常与 username 相同。
      # 部分邮箱服务商要求发件地址必须与登录账号一致，否则会被拒信。
      from: ""

      # 非 465 端口时是否强制使用 STARTTLS 加密。
      # 使用 587 端口且服务商支持时应设为 true，避免明文传输。
      # 465 端口本身已是 SSL 加密，此项不生效。
      # 合法值: true（强制加密） / false（不强制）
      starttls: false


# =============================================================================
# 五、状态卡片
# =============================================================================

status-card:
  # 是否启用状态卡片功能。
  # 启用后，QQ 机器人查询状态时会回复一张图片卡片（含服务器图标、名称、
  # 在线人数、在线玩家、CPU 与内存占用等）。
  # 关闭则改为回复纯文本。
  # 合法值: true（发送图片） / false（发送文字）
  enable: true

  # 状态卡片中显示的服务器地址（仅用于展示，不用于实际连接）。
  # 查询状态时插件会尝试向该地址发起一次握手以获取服务器图标。
  server-host: 127.0.0.1

  # 状态卡片中使用的服务器端口。
  # 注意事项：填写的是 Minecraft 实际监听端口（server.properties 中的
  # server-port）。若服务器位于代理后方，请填写本地监听端口。
  server-port: 25565

  # 状态卡片中显示的服务器名称（图片标题）。
  server-display-name: "我的LuoOS服务器"

  # 状态卡片中显示的服务器简介（图片副标题）。
  server-description: "这里是服务器的简介"

  # 状态卡片中显示的连接地址（给玩家看的地址）。
  # 建议填写公网可连接的地址，例如 mc.example.top 或 域名:端口。
  server-display-ip: "mc.example.top"

  # 状态卡片背景遮罩的透明度（0 - 255）。
  # 数值越低背景越透明、越亮；数值越高背景越暗、文字越清晰。
  # 若背景图颜色较浅导致文字看不清，可适当调大。
  # 合法值: 0 - 255
  motd_bg_mask_alpha: 140


# =============================================================================
# 六、TPS 显示
# =============================================================================

# 是否在玩家列表底部显示服务器 TPS（每秒游戏刻数，反映服务器流畅度）。
# 说明：TPS 满值为 20；持续低于 15 说明服务器存在性能压力。
# 合法值: true（显示） / false（不显示）
enableAutoLogTps: true

# TPS 信息的刷新间隔，单位为 tick（1 秒 = 20 tick）。
# 数值越小刷新越快，但会增加少量统计开销。
# 合法值: 10 - 1200
autoLogTpsDelayTicks: 20


# =============================================================================
# 七、配方查看器同步
# =============================================================================

# 是否将服务器配方数据同步给客户端的 JEI / REI 等配方查看器。
# 说明：仅 Minecraft 1.21.2 及以上版本生效；开启后玩家可在客户端直接查看
#       服务器自定义配方，无需手动安装数据包。
# 合法值: true（启用） / false（禁用）
enableRecipeViewerSync: true


# =============================================================================
# 八、封禁系统
# =============================================================================

# 是否启用 LuoOS 自带的封禁系统（/ban、/unban、封禁列表等）。
# 说明：封禁会在 Netty 层拦截，被封禁的账号无法进入服务器。
#       与 QQ 机器人的封禁命令共用同一份数据，可在群里封禁玩家。
# 合法值: true（启用） / false（禁用）
enableCustomBan: true


# =============================================================================
# 九、玩家数据迁移工具
# =============================================================================

# 是否启用玩家数据迁移功能（/los migrate）。
# 用途：把玩家数据在「正版账号」与「离线账号」之间转移，
#       常见于服务器从离线模式切换到正版模式时的数据搬迁。
# 建议：仅在需要迁移时临时开启，迁移完成后关闭，避免误操作。
# 合法值: true（启用） / false（禁用）
enablePlayerDataMigration: false

# 迁移期间，相关玩家被临时禁止进入的时间（秒）。
# 防止迁移过程中玩家登录导致数据错乱。
# 合法值: 10 - 3600
migrationBanSeconds: 30


# =============================================================================
# 十、会话与安全限制
# =============================================================================

# 同一 IP 地址最多允许同时在线的人数。
# 用途：限制同一网络下的多开行为。
# 说明：填 -1 表示不限制；请谨慎设置，过小会误伤同一网吧/宿舍的玩家。
# 合法值: -1（不限制）或任意正整数
maxConcurrentSessionsPerIp: -1

# 同一 IP 在线人数超限时，给玩家的踢出提示文字。
sessionLimitKickMessage: "该IP的在线会话数已达上限"

# 同一用户名连续登录失败多少次后被临时锁定。
# 用途：防止针对某个账号的暴力破解。
# 合法值: 3 - 100
usernameLoginFailureLimit: 5

# 用户名被失败锁定后，多少秒后自动解锁。
# 合法值: 10 - 3600
usernameLoginFailureLockSeconds: 30

# 同一 IP 连续登录失败多少次后被临时锁定。
# 用途：防止同一来源批量尝试不同账号。
# 说明：多人共用出口 IP 时不要设置过小。
# 合法值: 3 - 100
ipLoginFailureLimit: 10

# IP 被失败锁定后，多少秒后自动解锁。
# 合法值: 10 - 3600
ipLoginFailureLockSeconds: 60


# =============================================================================
# 十一、服务器维护模式
# =============================================================================

# 是否启用维护模式。
# 开启后只有管理员（OP）可以进入服务器，普通玩家会被拒绝连接。
# 操作：在游戏内或控制台执行 /los maintenance on|off|status 控制。
# 说明：该设置会写入文件，重启后依然有效；维护结束后请记得关闭。
# 合法值: true（维护中） / false（正常开放）
maintenance: false


# =============================================================================
# 十二、资源世界
# =============================================================================

# 资源世界是一个定期自动刷新的独立世界，供玩家自由采集资源。
# 刷新时旧世界会被删除并按新种子重新生成；刷新前后会全服广播提醒。
# 玩家可使用 /los resource 传送进入。
# 依赖插件：Worlds（v4.2.2 及以上），未安装则该模块不生效。
resourceWorld:
  # 是否启用资源世界功能。
  # 合法值: true（启用） / false（禁用）
  enabled: false

  # 每月自动刷新的日期（按服务器本地时区）。
  # 说明：填 25 表示每月 25 日刷新；若当月没有该日期（如 31 日的月份），
  #       则按当月最后一天处理。
  # 合法值: 1 - 31
  refreshDayOfMonth: 25

  # 每月自动刷新的小时（按服务器本地时区，24 小时制）。
  # 建议选择玩家较少的时段，如凌晨 4-8 点。
  # 合法值: 0 - 23
  refreshHour: 8

  # 是否同时创建资源世界的下界维度。
  # 下界与主世界使用相同种子生成。
  # 合法值: true（创建） / false（不创建）
  nether: true

  # 是否同时创建资源世界的末地维度。
  # 末地与主世界使用相同种子生成。
  # 合法值: true（创建） / false（不创建）
  end: true
